services:
  - type: web
    name: astre-server
    runtime: node
    plan: free
    rootDir: astre_server
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astre-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: CONTRACT_ID
        sync: false
      - key: SOURCE_SECRET_KEY
        sync: false
      - key: PORT
        value: 3000

databases:
  - name: astre-db
    plan: free
